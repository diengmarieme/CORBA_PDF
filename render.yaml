services:
  # 1. LE BACKEND CORBA & NAMING SERVICE (Déjà fonctionnel)
  - type: web
    name: pdf-corba-backend
    runtime: docker
    rootDir: .
    dockerfilePath: Dockerfile.server
    plan: free
    envVars:
      - key: PORT
        value: 2809

  # 2. LE MIDDLEWARE SPRING BOOT
  - type: web
    name: pdf-corba-middleware
    runtime: docker
    rootDir: .
    dockerfilePath: Dockerfile.web
    plan: free
    healthCheckPath: "" # Désactive le Health Check HTTP bloquant pour Spring Boot
    envVars:
      - key: PORT
        value: 8080
      - key: CORBA_NAMING_HOST
        value: pdf-corba-backend
      - key: CORBA_NAMING_PORT
        value: "2809"

  # 3. LE FRONTEND NGINX
  - type: web
    name: pdf-corba-frontend
    runtime: docker
    rootDir: .
    dockerfilePath: Dockerfile
    plan: free
    healthCheckPath: "" # Désactive le Health Check HTTP bloquant pour le Frontend
    envVars:
      - key: PORT
        value: 80
