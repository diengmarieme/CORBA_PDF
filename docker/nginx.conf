server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass https://pdf-corba-middleware.onrender.com/api/;
        proxy_set_header Host pdf-corba-middleware.onrender.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_ssl_server_name on;
        client_max_body_size 200M;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
