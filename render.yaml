# ================================================================
#  render.yaml — PDF Studio (Single Container)
#  Placer ce fichier à la RACINE du dépôt GitHub
#  Render le détecte automatiquement (Blueprint)
# ================================================================

services:
  - type: web
    name: pdf-studio
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: PORT
        value: "10000"
      - key: JAVA_OPTS
        value: "-Xms64m -Xmx200m -Djava.awt.headless=true"
