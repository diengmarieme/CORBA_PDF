services:
  # 1. LE BACKEND CORBA & NAMING SERVICE (JacORB)
  - type: web
    name: pdf-corba-backend
    runtime: docker
    rootDir: . # Reste à la racine globale pour trouver le Dockerfile
    dockerfilePath: Dockerfile.server # Trouve le Dockerfile.server vu dans ton ls
    plan: free
    envVars:
      - key: PORT
        value: 2809

  # 2. LE MIDDLEWARE SPRING BOOT (API REST)
  - type: web
    name: pdf-corba-middleware
    runtime: docker
    rootDir: . # Reste à la racine globale pour trouver le Dockerfile
    dockerfilePath: Dockerfile.web # Trouve le Dockerfile.web vu dans ton ls
    plan: free
    envVars:
      - key: PORT
        value: 8080
      - key: CORBA_NAMING_HOST
        value: pdf-corba-backend
      - key: CORBA_NAMING_PORT
        value: "2809"

  # 3. LE FRONTEND (Interface utilisateur Nginx / HTML5)
  - type: web
    name: pdf-corba-frontend
    runtime: docker
    rootDir: . # Reste à la racine globale pour trouver le Dockerfile
    dockerfilePath: Dockerfile # Trouve le Dockerfile générique de ton ls
    plan: free
    envVars:
      - key: PORT
        value: 80
