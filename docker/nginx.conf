# =============================================================
# nginx.conf — Serveur frontend + reverse proxy vers l'API
# =============================================================

server {
    listen 80;
    server_name _;

    # ── Frontend statique ─────────────────────────────────────
    root  /usr/share/nginx/html;
    index index.html;

    # Compression gzip
    gzip on;
    gzip_types text/html text/css application/javascript;
    gzip_min_length 1000;

    # Cache pour les assets statiques
    location ~* \.(css|js|ico|png|jpg|svg)$ {
        expires 1d;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Reverse proxy vers l'API Spring Boot ─────────────────
    # Permet au frontend servi par Nginx d'appeler /api/pdf/*
    # sans problème de CORS (même origine)
    location /api/ {
        proxy_pass         http://web:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Timeout élevé pour les gros PDFs (compression, conversion)
        proxy_connect_timeout  10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;

        # Taille max upload 50 Mo
        client_max_body_size  50M;
        proxy_request_buffering off;
    }

    # Logs
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;
}
